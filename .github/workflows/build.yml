name: Build Note 9 - The Time Machine
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04 # Môi trường hoàn hảo cho Kernel 4.9
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: stock

      - name: Install Legacy Dependencies
        run: |
          apt-get update
          apt-get install -y build-essential bc zip curl git libssl-dev bison flex libelf-dev libncurses5-dev libssl-dev wget ca-certificates
          
      - name: Download Toolchains
        run: |
          mkdir -p /toolchains/arm64
          mkdir -p /toolchains/arm32
          wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/aarch64-linux-gnu/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          tar -xJf gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz -C /toolchains/arm64 --strip-components=1
          wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-linux-gnueabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz
          tar -xJf gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz -C /toolchains/arm32 --strip-components=1

      - name: Phẫu thuật Kernel & KSU
        run: |
          # Integrate KSU
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next KernelSU
          cp -r KernelSU/kernel drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          # Fix Kconfig (Tuyệt chiêu ghi đè)
          mkdir -p fs/sdcardfs
          echo 'config SDCARDFS_FS' > fs/sdcardfs/Kconfig
          echo '    tristate "SDCard filesystem support"' >> fs/sdcardfs/Kconfig
          echo '    default y' >> fs/sdcardfs/Kconfig

      - name: Final Compile
        run: |
          # Biến môi trường cố định
          export ARCH=arm64
          export CROSS_COMPILE=/toolchains/arm64/bin/aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=/toolchains/arm32/bin/arm-linux-gnueabi-
          export ANDROID_MAJOR_VERSION=10
          
          mkdir -p out
          
          # 1. Config
          make O=out exynos9810-crownlte_defconfig
          
          # 2. Sửa config trực tiếp
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          sed -i 's/CONFIG_ARM64_LSE_ATOMICS=y/CONFIG_ARM64_LSE_ATOMICS=n/g' out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          
          # 3. Chấp nhận config
          make O=out olddefconfig
          
          # 4. Build - Ubuntu 18.04 sẽ không bị lỗi scripts như 24.04
          make -j$(nproc --all) O=out Image.gz-dtb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Note9-Docker-18.04
          path: out/arch/arm64/boot/Image.gz-dtb
