name: Build Note 9 Pure GCC 4.9 + KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: stock

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc zip curl git libssl-dev bison flex libelf-dev libncurses5
          
      - name: Download Linaro GCC 4.9 (The Original Toolchain)
        run: |
          # Tải GCC 4.9 - Trình biên dịch chuẩn cho Note 9
          mkdir -p $GITHUB_WORKSPACE/gcc-linaro
          wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/aarch64-linux-gnu/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          tar -xJf gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz -C $GITHUB_WORKSPACE/gcc-linaro --strip-components=1
          
          mkdir -p $GITHUB_WORKSPACE/gcc-arm32
          wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-linux-gnueabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz
          tar -xJf gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz -C $GITHUB_WORKSPACE/gcc-arm32 --strip-components=1

      - name: Integrate KernelSU-Next
        run: |
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next KernelSU
          cp -r KernelSU/kernel drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile

      - name: Phẫu thuật mã nguồn (Bắt buộc)
        run: |
          # Sửa lỗi DTC yylloc
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          # Fix Kconfig sdcardfs
          cat << 'EOF' > fs/sdcardfs/Kconfig
          config SDCARDFS_FS
          	tristate "SDCard filesystem support"
          	default y
          	help
          	  Sdcardfs is a stackable wrap-around filesystem.
          EOF

      - name: Compile Kernel
        run: |
          export CROSS_COMPILE=$GITHUB_WORKSPACE/gcc-linaro/bin/aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/gcc-arm32/bin/arm-linux-gnueabi-
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=10
          
          # Dùng BASH để chạy make, tránh lỗi Illegal Option
          /bin/bash -c "
            make O=out exynos9810-crownlte_defconfig
            
            # Tắt các thứ gây lỗi biên dịch
            sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
            sed -i 's/CONFIG_ARM64_LSE_ATOMICS=y/CONFIG_ARM64_LSE_ATOMICS=n/g' out/.config
            
            make -j$(nproc --all) O=out HOSTCFLAGS='-fcommon' Image.gz-dtb
          "

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Note9-Linaro-GCC49
          path: out/arch/arm64/boot/Image.gz-dtb
