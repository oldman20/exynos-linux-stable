name: Build Note 9 Docker-GCC + KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # Dùng bản mới nhất để có máy ngay lập tức
    container:
      image: ubuntu:20.04 # Chạy mọi thứ bên trong môi trường 20.04
    steps:
      - name: Install Dependencies Inside Container
        run: |
          apt-get update
          apt-get install -y build-essential bc zip curl git libssl-dev bison flex libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libncurses5 sudo
          
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: stock

      - name: Integrate KernelSU-Next
        run: |
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next KernelSU
          cp -r KernelSU/kernel drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile

      - name: Phẫu thuật mã nguồn (GCC Optimizing)
        run: |
          # Sửa lỗi DTC yylloc
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # Fix Kconfig sdcardfs
          cat << 'EOF' > fs/sdcardfs/Kconfig
          config SDCARDFS_FS
          	tristate "SDCard filesystem support"
          	default y
          	help
          	  Sdcardfs is a stackable wrap-around filesystem.
          EOF
          
          # Inject KSU Hooks
          sed -i '/#include <linux\/syscalls.h>/a #include <linux/kernelsu.h>' fs/read_write.c
          sed -i '/ssize_t ret;/a \n\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);' fs/read_write.c
          sed -i '/#include <linux\/compat.h>/a #include <linux/kernelsu.h>' fs/exec.c
          sed -i '/int retval;/a \n\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);' fs/exec.c
          sed -i '/#include <linux\/ima.h>/a #include <linux/kernelsu.h>' fs/open.c
          sed -i '/struct file \*f;/a \n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_ptr, int *mode, int *flags);\n\tksu_handle_faccessat(&dfd, &filename, &mode, &flags);' fs/open.c

      - name: Configure Kernel (Disable LSE)
        run: |
          DEFCONFIG=exynos9810-crownlte_defconfig
          CONF_PATH=arch/arm64/configs/$DEFCONFIG
          
          # Tắt LSE - Triệt tiêu lỗi spinlock.h
          echo "CONFIG_ARM64_LSE_ATOMICS=n" >> $CONF_PATH
          echo "CONFIG_KSU=y" >> $CONF_PATH
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $CONF_PATH
          
          # Hạ cấp bảo mật để GCC 10 chạy mượt
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_REGULAR=y/g' $CONF_PATH
          sed -i 's/CONFIG_UH_RKP=y/CONFIG_UH_RKP=n/g' $CONF_PATH
          sed -i 's/CONFIG_TIMA=y/CONFIG_TIMA=n/g' $CONF_PATH
          sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' $CONF_PATH

      - name: Compile Kernel
        run: |
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCFLAGS="-fcommon" exynos9810-crownlte_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- HOSTCFLAGS="-fcommon" Image.gz-dtb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Note9-Docker-GCC
          path: out/arch/arm64/boot/Image.gz-dtb
