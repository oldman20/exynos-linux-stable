name: Build Pure Stock + KSU-Next
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # Quay lại bản mới nhất để được cấp máy nhanh
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: stock

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc zip curl git libssl-dev bison flex libelf-dev
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-llvm

      - name: Purge Old Data & Integrate KSU-Next
        run: |
          rm -rf drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next KernelSU
          cp -r KernelSU/kernel drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile

      - name: Inject KernelSU-Next Hooks (Manual)
        run: |
          sed -i '/#include <linux\/syscalls.h>/a #include <linux/kernelsu.h>' fs/read_write.c
          sed -i '/ssize_t ret;/a \\n\textern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr, size_t *count_ptr, loff_t **pos);\n\tksu_handle_vfs_read(&file, &buf, &count, &pos);' fs/read_write.c
          sed -i '/#include <linux\/compat.h>/a #include <linux/kernelsu.h>' fs/exec.c
          sed -i '/int retval;/a \\n\textern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);' fs/exec.c
          sed -i '/#include <linux\/ima.h>/a #include <linux/kernelsu.h>' fs/open.c
          sed -i '/struct file \*f;/a \\n\textern int ksu_handle_faccessat(int *dfd, const char __user **filename_ptr, int *mode, int *flags);\n\tksu_handle_faccessat(&dfd, &filename, &mode, &flags);' fs/open.c

      - name: Configure Kernel
        run: |
          DEFCONFIG=exynos9810-crownlte_defconfig
          CONF_PATH=arch/arm64/configs/$DEFCONFIG
          echo "CONFIG_KSU=y" >> $CONF_PATH
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> $CONF_PATH
          sed -i 's/CONFIG_KPROBES=y/# CONFIG_KPROBES is not set/g' $CONF_PATH
          sed -i 's/CONFIG_UH_RKP=y/CONFIG_UH_RKP=n/g' $CONF_PATH
          sed -i 's/CONFIG_TIMA=y/CONFIG_TIMA=n/g' $CONF_PATH
          sed -i 's/CONFIG_KNOX_KAP=y/CONFIG_KNOX_KAP=n/g' $CONF_PATH

      - name: Compile Kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang-llvm/bin:$PATH
          # Chiến thuật mới: Dùng LD_PRELOAD hoặc ép LD để né lỗi libc của Proton Clang
          args="-j$(nproc --all) O=out ARCH=arm64 CC=clang HOSTCC=gcc HOSTCXX=g++ CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD=aarch64-linux-gnu-ld"
          
          make $args exynos9810-crownlte_defconfig
          make $args Image.gz-dtb KBUILD_CFLAGS="-Wno-error -Wno-implicit-function-declaration"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Note9-Stock-${{ github.run_number }}
          path: out/arch/arm64/boot/Image.gz-dtb
