name: Build Note 9 Final Boss - Hard Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: stock

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc zip curl git libssl-dev bison flex libelf-dev libncurses6 libncurses-dev libssl-dev
          
      - name: Setup Linaro GCC 4.9 (The Legend)
        run: |
          mkdir -p $GITHUB_WORKSPACE/tc-arm64
          curl -LSs https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/aarch64-linux-gnu/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz | tar -xJ -C $GITHUB_WORKSPACE/tc-arm64 --strip-components=1
          mkdir -p $GITHUB_WORKSPACE/tc-arm32
          curl -LSs https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-linux-gnueabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz | tar -xJ -C $GITHUB_WORKSPACE/tc-arm32 --strip-components=1
          
          # Kiểm tra xem toolchain có chạy được không
          $GITHUB_WORKSPACE/tc-arm64/bin/aarch64-linux-gnu-gcc --version

      - name: Phẫu thuật triệt để
        run: |
          # 1. Integrate KSU-Next
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next KernelSU
          cp -r KernelSU/kernel drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          # 2. Sửa lỗi DTC yylloc
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 3. GHI ĐÈ HOÀN TOÀN Kconfig sdcardfs (Diệt lỗi file "10/Kconfig")
          mkdir -p fs/sdcardfs
          echo 'config SDCARDFS_FS' > fs/sdcardfs/Kconfig
          echo '    tristate "SDCard filesystem support"' >> fs/sdcardfs/Kconfig
          echo '    default y' >> fs/sdcardfs/Kconfig

      - name: Compile Kernel (Hard-Coded Environment)
        run: |
          # CHÌA KHÓA: Đẩy Toolchain vào PATH hệ thống
          export PATH=$GITHUB_WORKSPACE/tc-arm64/bin:$GITHUB_WORKSPACE/tc-arm32/bin:$PATH
          
          # EXPORT TOÀN CỤC - Không dùng biến args nữa
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=aarch64-linux-gnu-gcc
          export LD=aarch64-linux-gnu-ld
          export ANDROID_MAJOR_VERSION=10
          export KBUILD_BUILD_USER=oldman
          export KBUILD_BUILD_HOST=R&D-Center
          
          mkdir -p out
          
          # Lệnh make cực kỳ tường minh
          make O=out exynos9810-crownlte_defconfig
          
          # Ép cấu hình (Dùng lệnh an toàn hơn)
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          sed -i 's/CONFIG_ARM64_LSE_ATOMICS=y/CONFIG_ARM64_LSE_ATOMICS=n/g' out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          
          make O=out olddefconfig
          
          # BUILD VỚI VERBOSE=1 ĐỂ SOI LỖI NẾU CÓ
          make -j$(nproc --all) O=out V=1 HOSTCFLAGS="-fcommon" Image.gz-dtb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Note9-Final-Champion
          path: out/arch/arm64/boot/Image.gz-dtb
