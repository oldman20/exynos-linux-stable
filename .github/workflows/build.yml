name: Build Note 9 Final Fix
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: stock

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc zip curl git libssl-dev bison flex libelf-dev libncurses6 libncurses-dev libssl-dev
          
      - name: Setup Linaro GCC 4.9
        run: |
          mkdir -p $GITHUB_WORKSPACE/tc-arm64
          curl -LSs https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/aarch64-linux-gnu/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz | tar -xJ -C $GITHUB_WORKSPACE/tc-arm64 --strip-components=1
          mkdir -p $GITHUB_WORKSPACE/tc-arm32
          curl -LSs https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-linux-gnueabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz | tar -xJ -C $GITHUB_WORKSPACE/tc-arm32 --strip-components=1

      - name: Phẫu thuật mã nguồn
        run: |
          # 1. Integrate KSU-Next
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next KernelSU
          cp -r KernelSU/kernel drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          # 2. Sửa lỗi DTC yylloc (Bắt buộc cho Ubuntu mới)
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # 3. Ghi đè Kconfig sdcardfs (Diệt lỗi logic 10/Kconfig)
          mkdir -p fs/sdcardfs
          echo 'config SDCARDFS_FS' > fs/sdcardfs/Kconfig
          echo '    tristate "SDCard filesystem support"' >> fs/sdcardfs/Kconfig
          echo '    default y' >> fs/sdcardfs/Kconfig

      - name: Compile Kernel
        run: |
          # Thiết lập đường dẫn Toolchain
          TC64="$GITHUB_WORKSPACE/tc-arm64/bin/aarch64-linux-gnu-"
          TC32="$GITHUB_WORKSPACE/tc-arm32/bin/arm-linux-gnueabi-"
          
          mkdir -p out
          
          # Định nghĩa các tham số build - KHÔNG DÙNG KÝ TỰ ĐẶC BIỆT
          export ARCH=arm64
          export ANDROID_MAJOR_VERSION=10
          export KBUILD_BUILD_USER="oldman"
          export KBUILD_BUILD_HOST="BuildServer"
          
          # 1. Khởi tạo Defconfig
          make O=out CROSS_COMPILE="$TC64" CROSS_COMPILE_ARM32="$TC32" exynos9810-crownlte_defconfig
          
          # 2. Ép cấu hình: Tắt bảo mật gây lỗi ASM, bật KSU
          sed -i 's/CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/g' out/.config
          sed -i 's/CONFIG_ARM64_LSE_ATOMICS=y/CONFIG_ARM64_LSE_ATOMICS=n/g' out/.config
          echo "CONFIG_KSU=y" >> out/.config
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> out/.config
          
          # 3. Chấp nhận cấu hình mới (olddefconfig cực kỳ quan trọng)
          make O=out CROSS_COMPILE="$TC64" CROSS_COMPILE_ARM32="$TC32" olddefconfig
          
          # 4. Biên dịch chính thức
          # Thêm HOSTCFLAGS để tránh lỗi scripts trên Ubuntu 24.04
          make -j$(nproc --all) O=out \
               CROSS_COMPILE="$TC64" \
               CROSS_COMPILE_ARM32="$TC32" \
               HOSTCFLAGS="-fcommon" \
               HOSTCXXFLAGS="-fcommon" \
               Image.gz-dtb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Note9-Final-Fixed
          path: out/arch/arm64/boot/Image.gz-dtb
