name: Build Note 9 Linaro GCC 4.9 + KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: stock

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc zip curl git libssl-dev bison flex libelf-dev libncurses6 libncurses-dev
          
      - name: Download Linaro GCC 4.9
        run: |
          mkdir -p $GITHUB_WORKSPACE/gcc-linaro
          wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/aarch64-linux-gnu/gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz
          tar -xJf gcc-linaro-4.9.4-2017.01-x86_64_aarch64-linux-gnu.tar.xz -C $GITHUB_WORKSPACE/gcc-linaro --strip-components=1
          
          mkdir -p $GITHUB_WORKSPACE/gcc-arm32
          wget -q https://releases.linaro.org/components/toolchain/binaries/4.9-2017.01/arm-linux-gnueabi/gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz
          tar -xJf gcc-linaro-4.9.4-2017.01-x86_64_arm-linux-gnueabi.tar.xz -C $GITHUB_WORKSPACE/gcc-arm32 --strip-components=1

      - name: Phẫu thuật mã nguồn & KSU
        run: |
          # Integrate KSU
          rm -rf drivers/kernelsu
          git clone --depth=1 https://github.com/rifsxd/KernelSU-Next KernelSU
          cp -r KernelSU/kernel drivers/kernelsu
          sed -i '/kernelsu/d' drivers/Makefile
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          # Fix DTC yylloc
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' scripts/dtc/dtc-lexer.lex.c_shipped || true
          
          # Fix Kconfig sdcardfs
          cat << 'EOF' > fs/sdcardfs/Kconfig
          config SDCARDFS_FS
          	tristate "SDCard filesystem support"
          	default y
          EOF

      - name: Compile Kernel
        run: |
          # Thiết lập môi trường cực kỳ nghiêm ngặt
          export TOOLCHAIN=$GITHUB_WORKSPACE/gcc-linaro/bin/aarch64-linux-gnu-
          export TOOLCHAIN_ARM32=$GITHUB_WORKSPACE/gcc-arm32/bin/arm-linux-gnueabi-
          
          # ÉP BUỘC toàn bộ hệ thống dùng BASH thay vì SH để tránh lỗi "Illegal Option"
          sudo ln -sf /bin/bash /bin/sh
          
          mkdir -p out
          
          # Bước 1: Tạo config mặc định
          make O=out ARCH=arm64 CROSS_COMPILE=$TOOLCHAIN CROSS_COMPILE_ARM32=$TOOLCHAIN_ARM32 ANDROID_MAJOR_VERSION=10 exynos9810-crownlte_defconfig
          
          # Bước 2: Chèn cấu hình bằng Script (Tránh dùng sed thủ công gây lỗi oldconfig)
          scripts/config --file out/.config \
            --disable CC_STACKPROTECTOR_STRONG \
            --enable CC_STACKPROTECTOR_NONE \
            --disable ARM64_LSE_ATOMICS \
            --enable KSU \
            --enable KSU_MANUAL_HOOK
            
          # Bước 3: Ép chấp nhận cấu hình mới mà không hỏi (Sửa lỗi "aborted" của ông)
          make O=out ARCH=arm64 CROSS_COMPILE=$TOOLCHAIN CROSS_COMPILE_ARM32=$TOOLCHAIN_ARM32 ANDROID_MAJOR_VERSION=10 olddefconfig
          
          # Bước 4: Build chính thức
          make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=$TOOLCHAIN CROSS_COMPILE_ARM32=$TOOLCHAIN_ARM32 ANDROID_MAJOR_VERSION=10 HOSTCFLAGS="-fcommon" Image.gz-dtb

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-Note9-Final-Result
          path: out/arch/arm64/boot/Image.gz-dtb
